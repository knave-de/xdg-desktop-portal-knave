[package]
name = "lamco-data-control"
version = "1.0.0"
edition = "2024"
rust-version = "1.87"
license = "MIT OR Apache-2.0"
description = "Wayland data-control clipboard client (ext-data-control-v1 and wlr-data-control) with on-demand pastes"
repository = "https://github.com/lamco-admin/xdg-desktop-portal-generic"
homepage = "https://www.lamco.ai"
documentation = "https://docs.rs/lamco-data-control"
readme = "README.md"
keywords = ["wayland", "clipboard", "data-control", "wlroots", "selection"]
categories = ["os::linux-apis", "api-bindings"]
include = [
    "/src/",
    "/examples/",
    "/tests/",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
]

[badges]
maintenance = { status = "actively-developed" }

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu"]
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
nix = { version = "0.31", features = ["fs", "poll"] }
thiserror = "2.0"
tracing = "0.1"

[lints]
workspace = true
