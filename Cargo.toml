[workspace]
members = [".", "crates/lamco-data-control"]

[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
elided_lifetimes_in_paths = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { priority = -1, level = "deny" }
allow_attributes = "deny"

# Pedantic lints that are false-positive-prone or low-value for this project
missing_errors_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"
similar_names = "allow"
items_after_statements = "allow"
missing_panics_doc = "allow"
unused_async = "allow"
struct_excessive_bools = "allow"

# Wayland/D-Bus protocol code requires numeric casts extensively
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
cast_lossless = "allow"
cast_precision_loss = "allow"

# Functional lints
wildcard_imports = "deny"
large_futures = "warn"

# Progressive (start as warn, upgrade to deny when clean)
unwrap_used = "warn"
expect_used = "warn"

[package]
name = "xdg-desktop-portal-knave"
version = "0.0.1"
edition = "2024"
rust-version = "1.87"
license = "MIT OR Apache-2.0"
description = "XDG Desktop Portal backend for Knave Desktop on Wayland"
repository = "https://github.com/knave-de/xdg-desktop-portal-knave"
homepage = "https://github.com/knave-de/xdg-desktop-portal-knave"
keywords = ["wayland", "portal", "screencopy", "input", "clipboard"]
categories = ["os::unix-apis", "api-bindings"]
documentation = "https://docs.rs/xdg-desktop-portal-knave"
readme = "README.md"

exclude = [
    "/.github/",
    "/.githooks/",
    "deny.toml",
    ".editorconfig",
    "Makefile",
    "clippy.toml",
    "about.toml",
    "about.hbs",
]

[badges]
maintenance = { status = "actively-developed" }

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu"]
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
knave-config = { path = "../knave/crates/knave-config" }
knave-portal-api = { path = "../knave/crates/knave-portal-api" }
serde_json = "1"
tempfile = "3.8"
base64 = "0.22"
png = "0.18"
lamco-data-control = { version = "1.0.1", path = "crates/lamco-data-control" }
# D-Bus service implementation
zbus = { version = "5.2", features = ["tokio"] }
zvariant = "5.2"

# Async runtime
tokio = { version = "1.35", features = ["full"] }

# EIS protocol (input injection)
reis = "0.7"
enumflags2 = "0.7"

# Wayland client (for wlr virtual input backend)
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
wayland-protocols-misc = { version = "0.3", features = ["client"] }

# PipeWire (screen capture)
pipewire = { version = "0.10", features = ["v0_3_34"] }
libspa = "0.10"

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities
futures = "0.3"
uuid = { version = "1.11", features = ["v4"] }

# XKB keymap handling
xkbcommon = { version = "0.9", features = ["wayland"] }

# Image encoding is shared with the picker.

# System
nix = { version = "0.31", features = ["socket", "poll", "fs", "mman", "time", "inotify", "event"] }
libc = "0.2"

# Optional: kernel-level input injection via /dev/uinput
evdev = { version = "0.13", optional = true }

[features]
# Kernel-level pointer injection via /dev/uinput.
# Fallback for compositors without wlr-virtual-pointer (e.g., COSMIC).
# Requires /dev/uinput access (input group membership).
uinput = ["dep:evdev"]

[dev-dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[lints]
workspace = true
